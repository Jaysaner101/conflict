<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter Culture Conflict gift card</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/base.css">
  <style>
    :root{ --bg:#000000; --ink:#eceeef; --body:#9aa0a5;
           --hi:#39FF14; --s1:#0a0b0c; }
    .gcw{max-width:520px;margin:0 auto;padding:clamp(40px,8vw,90px) 20px;text-align:center}
    .gcode{font-family:var(--hd);font-size:clamp(22px,4vw,34px);letter-spacing:.12em;color:var(--hi);
           border:1px solid var(--line);padding:18px;margin:22px 0;word-break:break-all}
    .gcqr{margin:22px auto;width:180px;height:180px}
  </style>
</head>
<body>
  <div class="gcw">
    <img src="/assets/logo-lockup.webp" alt="Counter Culture Conflict" style="width:140px;height:auto">
    <h1 class="bl sm" style="margin:18px 0 8px">A gift card for Counter Culture Conflict</h1>
    <p class="copy">Engraved gear, cut on an industrial fiber laser in Omaha.</p><p class="lab" style="margin-top:26px">Balance</p>
      <p class="bl md" style="margin:6px 0">$50</p><p class="lab" style="margin-top:26px">Your code</p>
      <div class="gcode">abcd1234efgh5678</div>
      <img class="gcqr" src="qr" alt="QR code for this gift card" width="180" height="180"><div class="btns" style="justify-content:center;margin-top:26px">
        <a class="btn solid" href="https://k0uw8n-4v.myshopify.com">Shop the store</a>
      </div>
      <p class="copy" style="margin-top:18px;font-size:13px">Enter the code at checkout.</p></div>

</html>
